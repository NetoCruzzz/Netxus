{% extends 'base.html' %}
{% block content %}

<section>
    <h1>New Discussion</h1>
    <form class ="discussion-form" action="{% url 'new_discussion' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="form-submit">Create Discussion</button>
    </form>
</section>

{% endblock %}
