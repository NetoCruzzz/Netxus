{% extends 'base.html' %}

{% block content %}
    <center>
        {% if searched %}
            <h2>Search Results for "{{ searched }}"</h2>
            <br/>
            {% for discussion in discussions %}
                <a href="{% url 'discussion' id=discussion.id %}">{{ discussion.name }}</a>
                <p>{{ discussion.description }}</p>
            {% endfor %}

        {% else %}
            <h2>No search query provided.</h2>
        {% endif %}

    </center>
{% endblock %}
