{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="section">

                <div class="profile-card">

                    <h1>Edit Profile</h1>

                    <p class="text-secondary mb-4">
                        Update your account information.
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="mt-4">

                            <button
                                type="submit"
                                class="btn btn-netxus"
                            >
                                Save Changes
                            </button>

                            <a
                                href="{% url 'profile' %}"
                                class="btn btn-outline-light ms-2"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
