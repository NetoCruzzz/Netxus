{% extends 'base.html' %}

{% block content %}

<!-- Ernesto: Pasted structure from create_post then AI helped me edit for HTTP -->
<div class="container mt-4">

    <h1> Edit Post </h1>

    <form method="POST">

        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary"> 
            Save Changes 
        </button>

        <a 
            href="{% url 'movies' post.movie.id %}" 
            class="btn btn-secondary"
        > 
            Cancel 
        </a>
    
    </form>
</div>

{% endblock %}
