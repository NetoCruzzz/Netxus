{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="section">

                <div class="post-card">

                    <h1 class="mb-3">
                        Delete Post?
                    </h1>

                    <p class="text-secondary">
                        Are you sure you want to delete this post?
                        This action cannot be undone.
                    </p>


                    <div class="post-card mt-4">

                        <h3 class="post-title">
                            {{ post.title }}
                        </h3>

                        <p class="post-content mt-3">
                            {{ post.content }}
                        </p>

                        <div class="post-meta">
                            Posted by {{ post.user.username }}
                        </div>

                    </div>


                    <form method="POST" class="mt-4">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Yes, Delete Post
                        </button>

                        <a
                            href="{% url 'discussion' id=post.movie.id %}"
                            class="btn btn-outline-light ms-2"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
