{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h1>Delete Post</h1>

    <p>
        Are you sure you want to delete this post?
    </p>

    <div class="card mb-4">

        <div class="card-body">

            <h2>{{ post.title }}</h2>

            <p>
                {{ post.content }}
            </p>

            <small>
                Posted by: {{ post.user.username }}
            </small>

        </div>

    </div>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes, Delete Post
        </button>

        <a
            href="{% url 'movies' post.movie.id %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
