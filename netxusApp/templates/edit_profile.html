{% extends 'base.html' %}

{% block title %}
    Edit Profile — Netxus
{% endblock %}

{% block content %}

<div class="container">

    <div class="form-page">

        <div class="form-page-header">

            <span class="section-label">
                ACCOUNT
            </span>

            <h1>
                Edit Profile
            </h1>

            <p>
                Update your account information.
            </p>

        </div>


        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>


                    <a
                        href="{% url 'profile' %}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
