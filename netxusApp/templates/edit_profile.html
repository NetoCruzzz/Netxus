{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    
    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="card-title mb-4"> Edit Profile </h1>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary"> Save Changes </button>

                <a href="{% url 'profile' %}" class="btn btn-secondary"> Cancel </a>
            </form>
        </div>
    </div>
</div>


{% endblock %}
