<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Netxus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* =========================
           GLOBAL
        ========================= */

        body {
            background: #0b0b0f;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            text-decoration: none;
        }

        .container {
            max-width: 1200px;
        }

        /* =========================
           NAVBAR
        ========================= */

        .netxus-navbar {
            background: rgba(12, 12, 16, 0.97);
            border-bottom: 1px solid #24242c;
            padding: 14px 0;
        }

        .netxus-logo {
            color: white !important;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .netxus-logo span {
            color: #e50914;
        }

        .netxus-navbar .nav-link {
            color: #aaa;
            margin: 0 5px;
            transition: 0.2s;
        }

        .netxus-navbar .nav-link:hover {
            color: white;
        }

        .netxus-search {
            background: #18181e;
            border: 1px solid #30303a;
            color: white;
        }

        .netxus-search:focus {
            background: #18181e;
            color: white;
            border-color: #e50914;
            box-shadow: none;
        }

        .netxus-search::placeholder {
            color: #777;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn-netxus {
            background: #e50914;
            color: white;
            border: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .btn-netxus:hover {
            background: #b80710;
            color: white;
        }

        .btn-outline-netxus {
            border: 1px solid #e50914;
            color: #e50914;
            background: transparent;
        }

        .btn-outline-netxus:hover {
            background: #e50914;
            color: white;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            padding: 90px 0 80px;
            background:
                radial-gradient(circle at 70% 30%, rgba(229, 9, 20, 0.18), transparent 35%),
                linear-gradient(180deg, #111116 0%, #0b0b0f 100%);
            border-bottom: 1px solid #202028;
        }

        .hero-label {
            color: #e50914;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.05;
            max-width: 750px;
        }

        .hero p {
            color: #a5a5ad;
            font-size: 1.1rem;
            max-width: 650px;
            line-height: 1.7;
        }

        /* =========================
           SECTION HEADERS
        ========================= */

        .section {
            padding: 55px 0 10px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.7rem;
            font-weight: 750;
            margin: 0;
        }

        .section-subtitle {
            color: #777;
            margin-top: 5px;
        }

        .section-line {
            width: 45px;
            height: 3px;
            background: #e50914;
            margin-top: 10px;
        }

        /* =========================
           MOVIE CARDS
        ========================= */

        .movie-card {
            background: #15151b;
            border: 1px solid #25252d;
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .movie-card:hover {
            transform: translateY(-6px);
            border-color: #44444e;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
        }

        .movie-card-body {
            padding: 18px;
        }

        .movie-title {
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .movie-title:hover {
            color: #e50914;
        }

        .movie-description {
            color: #92929b;
            font-size: 0.9rem;
            line-height: 1.5;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-link {
            color: #e50914;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .movie-link:hover {
            color: #ff4b54;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            background: #15151b;
            border: 1px solid #292932;
            border-radius: 12px;
            padding: 20px;
        }

        /* =========================
           FORMS
        ========================= */

        .form-control,
        .form-select {
            background: #15151b;
            border: 1px solid #30303a;
            color: white;
        }

        .form-control:focus,
        .form-select:focus {
            background: #15151b;
            color: white;
            border-color: #e50914;
            box-shadow: 0 0 0 0.15rem rgba(229, 9, 20, 0.15);
        }

        label {
            color: #ccc;
            margin-bottom: 6px;
        }

        /* Django form help/errors */

        .helptext {
            color: #777;
            font-size: 0.85rem;
        }

        ul.errorlist {
            color: #ff5b63;
            list-style: none;
            padding: 0;
        }

        /* =========================
           DISCUSSION PAGE
        ========================= */

        .discussion-hero {
            position: relative;
            min-height: 420px;
            display: flex;
            align-items: end;
            overflow: hidden;
            background: #111;
        }

        .discussion-banner {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
        }

        .discussion-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                #0b0b0f 5%,
                rgba(11, 11, 15, 0.65) 55%,
                rgba(11, 11, 15, 0.2)
            );
        }

        .discussion-info {
            position: relative;
            z-index: 2;
            padding: 50px 0;
        }

        .discussion-poster {
            width: 180px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .rating {
            color: #ffc107;
            font-weight: 700;
        }

        /* =========================
           POSTS
        ========================= */

        .post-card {
            background: #15151b;
            border: 1px solid #25252d;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .post-title {
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .post-content {
            color: #c2c2c9;
            line-height: 1.7;
        }

        .post-meta {
            color: #777;
            font-size: 0.85rem;
        }

        /* =========================
           PROFILE
        ========================= */

        .profile-card {
            max-width: 650px;
            margin: 60px auto;
            background: #15151b;
            border: 1px solid #292932;
            border-radius: 15px;
            padding: 35px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .profile-row {
            padding: 15px 0;
            border-bottom: 1px solid #292932;
        }

        .profile-label {
            color: #777;
            font-size: 0.85rem;
        }

        .profile-value {
            color: white;
            font-size: 1rem;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            border-top: 1px solid #24242c;
            margin-top: 80px;
            padding: 30px 0;
            color: #666;
            text-align: center;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .hero {
                padding: 60px 0;
            }

            .discussion-poster {
                width: 130px;
            }

            .discussion-hero {
                min-height: 500px;
            }

        }

    </style>
</head>

<body>

    {% include 'navbar.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <strong>NETXUS</strong>
            <div>Movie discussions. One community.</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
