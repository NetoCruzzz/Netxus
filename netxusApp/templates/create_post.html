{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="section">

                <div class="mb-4">

                    <p class="text-danger fw-bold text-uppercase">
                        New Discussion
                    </p>

                    <h1>
                        Talk about {{ movie.name }}
                    </h1>

                    <p class="text-secondary">
                        Share your thoughts with the Netxus community.
                    </p>

                </div>


                <div class="post-card">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="mt-4">

                            <button
                                type="submit"
                                class="btn btn-netxus"
                            >
                                Publish Post
                            </button>

                            <a
                                href="{% url 'movies' movie.id %}"
                                class="btn btn-outline-light ms-2"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
