<nav class="navbar navbar-expand-lg netxus-navbar">
    <div class="container">

        <a class="navbar-brand netxus-logo" href="{% url 'home' %}">
            NET<span>XUS</span>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'new_discussion' %}">
                        Create Discussion
                    </a>
                </li>

            </ul>

            <!-- Search -->
            <form
                class="d-flex me-lg-3 mb-3 mb-lg-0"
                method="POST"
                action="{% url 'search_results' %}"
            >

                {% csrf_token %}

                <input
                    class="form-control netxus-search me-2"
                    type="search"
                    name="searched"
                    placeholder="Search discussions..."
                >

                <button class="btn btn-outline-netxus">
                    Search
                </button>

            </form>

            <!-- Account -->

            <ul class="navbar-nav">

                {% if user.is_authenticated %}

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'profile' %}"
                        >
                            {{ user.username }}
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link text-danger"
                            href="{% url 'logout' %}"
                        >
                            Logout
                        </a>
                    </li>

                {% else %}

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'login' %}"
                        >
                            Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="btn btn-netxus ms-lg-2"
                            href="{% url 'register' %}"
                        >
                            Register
                        </a>
                    </li>

                {% endif %}

            </ul>

        </div>
    </div>
</nav>
